# Link check settings shared by every repository (links.yml writes this file when a repository
# has none). Keep the exclusions short and explain each one: a link that is excluded is a link
# nobody checks.

# Re-check a link at most once a day; the cache is kept between workflow runs.
cache = true
max_cache_age = "1d"
cache_exclude_status = "429, 500.."

max_concurrency = 8
max_retries = 3
timeout = 20

# Anchors (#section) in Markdown and HTML files must exist, so README buttons and the table of
# contents cannot point at a renamed heading.
include_fragments = "anchor-only"

# 403/429 from rate limiting are not broken links; everything else outside 2xx is.
accept = ["200..=299", "403", "429"]

exclude_loopback = true
exclude_private = true
exclude_link_local = true

exclude = [
  # Sites that answer automated requests with 999 or a sign-in wall.
  '^https://(www\.)?linkedin\.com/',
  '^https://(www\.)?x\.com/',
  # Placeholder hosts used in code samples.
  '^https?://(www\.)?example\.(com|org|net)',
  '^https?://api\.example\.com',
  # Pull request and comparison pages that only exist after a push.
  '^https://github\.com/[^/]+/[^/]+/compare/',
]

# The READMEs link to this repository's own files on main (graphics in .github/brand, images in
# docs/images, Package.swift, LICENSE, folders). A pull request cannot change main, so the
# checked-out files stand in for them: on main they are the same files, on a pull request they
# are the ones it adds or removes. The path is the workspace of GitHub-hosted runners; a local run
# passes the same --remap options with its own path.
remap = [
  '^https://raw\.githubusercontent\.com/muhittincamdali/educationai/main/(.*)$ file:///home/runner/work/educationai/educationai/$1',
  '^https://github\.com/muhittincamdali/educationai/(?:blob|tree)/main/(.*)$ file:///home/runner/work/educationai/educationai/$1',
  # The documentation pages on GitHub Pages are built from the .docc catalog by docs.yml after a
  # push to main, so a pull request that adds the catalog or an article links to pages that are
  # not online yet. The root and each article URL are checked against their source files instead.
  '^https://muhittincamdali\.github\.io/educationai/documentation/educationai/?$ file:///home/runner/work/educationai/educationai/Sources/EducationAI/EducationAI.docc/EducationAI.md',
  '^https://muhittincamdali\.github\.io/educationai/documentation/educationai/gettingstarted$ file:///home/runner/work/educationai/educationai/Sources/EducationAI/EducationAI.docc/GettingStarted.md',
  '^https://muhittincamdali\.github\.io/educationai/documentation/educationai/schedulingreviews$ file:///home/runner/work/educationai/educationai/Sources/EducationAI/EducationAI.docc/SchedulingReviews.md',
  '^https://muhittincamdali\.github\.io/educationai/documentation/educationai/buildingquizzes$ file:///home/runner/work/educationai/educationai/Sources/EducationAI/EducationAI.docc/BuildingQuizzes.md',
  '^https://muhittincamdali\.github\.io/educationai/documentation/educationai/trackingprogress$ file:///home/runner/work/educationai/educationai/Sources/EducationAI/EducationAI.docc/TrackingProgress.md',
]

exclude_path = [
  "node_modules",
  ".build",
  "build",
  "Pods",
]
